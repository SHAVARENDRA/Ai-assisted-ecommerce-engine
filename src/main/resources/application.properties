# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080
spring.application.name=ai-assisted-ecommerce-engine

# ---------------------------------------------------------------------------
# PostgreSQL (create 'ecommerce_db' in pgAdmin before first run)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
# TODO: Replace with your pgAdmin / PostgreSQL password below
spring.datasource.password=${DB_PASSWORD:your_password_here}

spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# Spring AI (OpenAI ChatClient)
# Set SPRING_AI_OPENAI_API_KEY in your environment before running.
# ---------------------------------------------------------------------------
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
